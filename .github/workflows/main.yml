name: Cypress Tests

on: 
    push:
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to run the tests'
                required: true
                type: choice
                options:
                - dev
                - qa

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Start Next app
        run: npm run dev &

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          wait-on: 'http://localhost:3000'
          browser: chrome
          spec: cypress/e2e/search.cy.js

      - name: Upload Cypress output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cypress-output
          path: cypress/output/bad_addresses_*.csv
